<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home preview (lab)</title>
    <!-- Lab only: fonts come from @fontsource (imported in home.ts); lane A self-hosts latin subsets + fontaine. -->
    <link rel="stylesheet" href="./stubs/tokens.css" />
    <style>
      html { background: var(--ground); color: var(--figure); }
      body { margin: 0; }
      .lab-masthead {
        position: fixed; inset: 0 0 auto; z-index: 10; height: 64px; display: flex; align-items: center; gap: 28px;
        padding: 0 var(--margin); font: 500 var(--t-small) / 1 var(--f-text);
        background: color-mix(in oklab, var(--ground) 88%, transparent); backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--hairline);
      }
      .lab-masthead b { font: 500 1.375rem/1 var(--f-display); margin-right: auto; }
      .lab-masthead span { font-family: var(--f-data); color: var(--muted); }
    </style>
  </head>
  <body>
    <header class="lab-masthead"><b>Curb</b> Clock Scorecard Notes Depth API <span>[lab masthead stub]</span></header>
    <main id="main"></main>
    <script type="module" src="./home.ts"></script>
  </body>
</html>
